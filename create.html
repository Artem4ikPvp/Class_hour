<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Новая заявка | Учебный час</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css?family=Oswald:400,300,700" rel="stylesheet">
</head>
<body>

  <section class="head">
    <a class="header__logo" href="index.html">
      <img src="image/book.png" width="40" height="40" alt="Логотип">
      Учебный час
    </a>
    <a class="button__login" href="orders.html">Мои заявки</a>
  </section>

  <section class="registr">
    <h1>Новая заявка</h1>
    <form>
      <label>Курс</label>
      <select class="data">
        <option>Выберите курс</option>
        <option>Программирование</option>
        <option>Управление проектами</option>
        <option>Графический дизайн</option>
      </select>

      <label>ФИО</label>
      <input type="text" class="data" placeholder="Введите ФИО">

      <label>Email</label>
      <input type="email" class="data" placeholder="Введите email">

      <label>Телефон</label>
      <input type="tel" class="data" placeholder="+7 (___) ___-__-__">

      <label>Комментарий</label>
      <textarea class="data" rows="4" placeholder="Расскажите о целях обучения"></textarea>

      <button type="submit" class="button__register">Отправить заявку</button>
    </form>
  </section>

  <footer class="footer">
    <div class="footer__container">
      <a class="footer__logo" href="index.html">
        <img src="image/book.png" width="26" height="26" alt="Логотип">
        Учебный час
      </a>
      <p class="footer__text">© 2025 Учебный час. Все права защищены.</p>
    </div>
  </footer>

</body>
</html>
